name: Publish container

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "deadsimple-email version to package"
        required: false
        default: "0.2.2"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          V="${{ inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          [ -z "$V" ] && V="0.2.2"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: DSE_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/deadsimple-email/deadsimple-email:${{ steps.meta.outputs.version }}
            ghcr.io/deadsimple-email/deadsimple-email:latest
